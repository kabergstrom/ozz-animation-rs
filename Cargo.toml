[package]
name = "ozz-animation-rs"
version = "0.11.0"
authors = ["SlimeYummy <zzzcccnnn@outlook.com>"]
edition = "2021"
rust-version = "1.88"
description = "A rust runtime library for ozz-animation with cross-platform deterministic."
license = "MPL-2.0"
homepage = "https://github.com/SlimeYummy/ozz-animation-rs"
repository = "https://github.com/SlimeYummy/ozz-animation-rs"
keywords = ["animation", "skeletal-animation", "fixed-point", "deterministic", "ozz-animation"]
categories = ["game-development", "rendering::data-formats", "api-bindings", "wasm"]
exclude = ["/.circleci", "/.github", "/demo", "/expected", "/output", "/resource"]
resolver = "2"

# STABLE FORK: glam/glam-ext without core-simd (nightly portable_simd) —
# the crate's own SIMD use goes through the scalar src/simd_compat.rs layer.
# Feature set otherwise unchanged from upstream.
[features]
default = ["rkyv", "serde"]
serde = ["dep:serde", "glam/serde", "bimap/serde" ]
rkyv = ["dep:rkyv", "dep:bytecheck", "glam/rkyv", "glam/bytecheck", "glam-ext/rkyv", "glam-ext/bytecheck"]
wasm = []
nodejs = ["wasm", "dep:js-sys", "dep:wasm-bindgen"]
# Offline builders (ozz-animation offline library port): RawSkeleton, RawAnimation,
# SkeletonBuilder, AnimationBuilder, AnimationOptimizer, ArchiveWriter. Std only,
# no extra dependencies; never on by default, so runtime users stay unchanged.
offline = []
# glTF channels to RawSkeleton/RawAnimation (gltf2ozz's job).
gltf = ["offline", "dep:gltf"]

[dependencies]
bimap = { version = "0.6" }
bytecheck = { version = "0.8", optional = true, default-features = false }
# No libm pin (upstream keeps it for cross-platform bit-determinism): the
# feature is contagious through cargo feature unification, and glam prefers
# libm over std when both are enabled — which routed every consumer's
# sqrt/sin_cos through soft-float (~40% of a 50k-instance frame in
# deferred-ngp). Host std math instead; the golden suites gate tolerance.
glam = { version = "0.30" }
glam-ext = { version = "0.3.2" }
gltf = { version = "1.4", optional = true, default-features = false, features = ["utils", "names"] }
js-sys = { version = "0.3", optional = true }
rkyv = { version = "0.8", optional = true }
serde = { version= "1", optional = true, features = [ "serde_derive" ] }
static_assertions = "1"
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
getrandom = { version = "0.2", features = ["js"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
miniz_oxide = "0.8"
rand = "0.8"
serde_json = "1.0"
wasm-bindgen-test = "0.3"
